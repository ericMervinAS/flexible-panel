<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Distraction Detector Evaluator</title>
  <style>
    :root {
      --bg: #0f0f10;
      --panel: #18181b;
      --panel2: #0a0a0b;
      --border: #2a2a2e;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #f97316;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="text"],
    input[type="number"] {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font: 12px inherit;
    }

    input[type="text"] {
      min-width: 260px;
      flex: 1;
      max-width: 500px;
    }

    input[type="number"] { width: 70px; }
    #folderInput { display: none; }

    .or-sep {
      color: var(--muted);
      font-size: 11px;
      padding: 0 2px;
    }

    #modelFileBtn {
      background: transparent !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      white-space: nowrap;
    }

    #modelFileBtn:hover { border-color: var(--accent) !important; }

    #modelFilename {
      font-size: 11px;
      color: var(--muted);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button, .fileBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font: 500 12px inherit;
    }

    button:hover:not(:disabled), .fileBtn:hover { background: #ea7016; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.secondary, .fileBtn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover, .fileBtn.secondary:hover {
      border-color: var(--accent);
      background: transparent;
    }

    .label { font-size: 11px; color: var(--muted); }

    .stats {
      display: flex;
      gap: 22px;
      font-size: 12px;
      color: var(--muted);
    }

    .stats strong { color: var(--text); font-weight: 600; }

    #status {
      font: 11px ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--muted);
      min-height: 14px;
      word-break: break-word;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      overflow: hidden;
    }

    #imageArea { overflow: auto; padding: 12px; }

    #imageGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .imgCard {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .imgCard canvas { width: 100%; display: block; height: auto; }

    .imgCard .caption {
      padding: 6px 8px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      border-top: 1px solid var(--border);
      gap: 6px;
    }

    .imgCard .caption .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .imgCard .caption .count { font-weight: 600; font-family: ui-monospace, monospace; flex-shrink: 0; }
    .imgCard .caption .count.zero { color: var(--muted); }
    .imgCard .caption .count.has { color: #22c55e; }

    #sidebar {
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .badge {
      background: var(--accent);
      color: #fff;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-family: ui-monospace, monospace;
    }

    #classStats {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .classStat {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
    }

    .classDot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .classStat .classCount {
      margin-left: auto;
      font-family: ui-monospace, monospace;
      font-weight: 600;
      color: var(--text);
    }

    .classStat .classCount.zero { color: var(--muted); font-weight: 400; }

    #detList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      align-content: start;
    }

    .detItem {
      background: var(--panel2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1;
    }

    .detItem canvas { width: 100%; height: 100%; display: block; }

    .detItem .meta {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      font: 9px ui-monospace, monospace;
      padding: 10px 4px 3px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detItem .classBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      padding: 40px 16px;
      text-align: center;
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>
  <header>
    <h1>Distraction Detector Evaluator <span class="label">— YOLOv8n custom, 6 classes</span></h1>
    <div class="row">
      <span class="label" style="min-width: 60px;">Model</span>
      <input id="modelUrl" type="text" placeholder="Paste ONNX URL…" />
      <button id="loadBtn">Load URL</button>
      <span class="or-sep">or</span>
      <button id="modelFileBtn" onclick="document.getElementById('modelFileInput').click()">Load .onnx file</button>
      <input id="modelFileInput" type="file" accept=".onnx,application/octet-stream" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden" />
      <span id="modelFilename"></span>
      <span class="label" style="margin-left: 10px;">conf</span>
      <input id="confInput" type="number" value="0.25" step="0.05" min="0" max="1" />
      <span class="label">nms</span>
      <input id="nmsInput" type="number" value="0.45" step="0.05" min="0" max="1" />
    </div>
    <div class="row">
      <label for="folderInput" class="fileBtn secondary">Pick folder</label>
      <input id="folderInput" type="file" webkitdirectory directory multiple />
      <button id="processBtn" disabled>Process</button>
      <button id="clearBtn" class="secondary">Clear</button>
      <span style="margin-left: auto;"></span>
      <div class="stats">
        <span>Images: <strong id="imgCount">0</strong></span>
        <span>Detections: <strong id="totalDets">0</strong></span>
        <span>Time: <strong id="elapsed">—</strong></span>
      </div>
    </div>
    <div id="status">Ready. Load a YOLOv8n ONNX model to begin.</div>
  </header>

  <main>
    <section id="imageArea">
      <div id="imageGrid">
        <div class="empty" style="grid-column: 1 / -1;">No images yet — load a model and pick a folder.</div>
      </div>
    </section>
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Detections</span>
        <span class="badge" id="detBadge">0</span>
      </div>
      <div id="classStats"></div>
      <div id="detList">
        <div class="empty">Detection crops will appear here.</div>
      </div>
    </aside>
  </main>

  <script src="/ort/ort.min.js"></script>
  <script>
    // ────────────────────────────────────────────────────────────────────────────
    // YOLOv8n ONNX — 6-class custom distraction detector
    //
    // Input:  [1, 3, 640, 640] float32 NCHW, RGB/255, letterboxed with gray padding
    // Output: [1, 4+numClasses, numAnchors] — cx/cy/w/h in letterboxed px + class scores
    //         numAnchors = 8400 for 640×640 input (80×80 + 40×40 + 20×20)
    //
    // Classes (must match training label order):
    //   0 Exit Sign  1 Fire Extinguisher  2 Fire Alarm
    //   3 Electrical Socket  4 Thermostat  5 Garbage Can
    // ────────────────────────────────────────────────────────────────────────────

    ort.env.wasm.wasmPaths = '/ort/';
    ort.env.wasm.numThreads = 1;

    const CLASSES = [
      'Exit Sign',
      'Fire Extinguisher',
      'Smoke Detector',
      'Electrical Outlet',
      'Thermostat',
      'Trash Can',
    ];

    const CLASS_COLORS = [
      '#f97316', // Exit Sign       — orange
      '#ef4444', // Fire Ext.       — red
      '#eab308', // Fire Alarm      — yellow
      '#3b82f6', // Elec. Socket    — blue
      '#a855f7', // Thermostat      — purple
      '#22c55e', // Garbage Can     — green
    ];

    const DET_SIZE = 320;
    const IMG_RE = /\.(jpe?g|png|webp|bmp)$/i;

    let session = null;
    let allDets = []; // { crop, score, classId, label, file }

    const $ = (id) => document.getElementById(id);
    const setStatus = (msg) => { $('status').textContent = msg; };

    // ── Preprocessing ────────────────────────────────────────────────────────────
    // Centered letterbox → [1,3,640,640] RGB/255 NCHW
    function preprocessYolo(img) {
      const scale = Math.min(DET_SIZE / img.naturalWidth, DET_SIZE / img.naturalHeight);
      const newW = Math.round(img.naturalWidth * scale);
      const newH = Math.round(img.naturalHeight * scale);
      const padX = Math.floor((DET_SIZE - newW) / 2);
      const padY = Math.floor((DET_SIZE - newH) / 2);

      const canvas = document.createElement('canvas');
      canvas.width = DET_SIZE;
      canvas.height = DET_SIZE;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, DET_SIZE, DET_SIZE);
      ctx.drawImage(img, padX, padY, newW, newH);

      const data = ctx.getImageData(0, 0, DET_SIZE, DET_SIZE).data;
      const n = DET_SIZE * DET_SIZE;
      const arr = new Float32Array(3 * n);
      for (let i = 0; i < n; i++) {
        arr[0 * n + i] = data[i * 4]     / 255; // R
        arr[1 * n + i] = data[i * 4 + 1] / 255; // G
        arr[2 * n + i] = data[i * 4 + 2] / 255; // B
      }
      return {
        tensor: new ort.Tensor('float32', arr, [1, 3, DET_SIZE, DET_SIZE]),
        scale, padX, padY,
      };
    }

    // ── NMS ──────────────────────────────────────────────────────────────────────
    function iou(a, b) {
      const inter =
        Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) *
        Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
      return inter / ((a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter + 1e-12);
    }

    function nms(boxes, scores, threshold) {
      const order = scores.map((_, i) => i).sort((a, b) => scores[b] - scores[a]);
      const suppressed = new Uint8Array(boxes.length);
      const keep = [];
      for (let p = 0; p < order.length; p++) {
        const i = order[p];
        if (suppressed[i]) continue;
        keep.push(i);
        for (let q = p + 1; q < order.length; q++) {
          const j = order[q];
          if (!suppressed[j] && iou(boxes[i], boxes[j]) >= threshold) suppressed[j] = 1;
        }
      }
      return keep;
    }

    // ── Output decoding ───────────────────────────────────────────────────────────
    // raw: [1, 4+nc, numAnchors] stored as flat row-major
    // Access: feature f, anchor a → raw[f * numAnchors + a]
    function decodeYoloOutput(raw, numClasses, numAnchors, scale, padX, padY, imgW, imgH) {
      const confThresh = parseFloat($('confInput').value);
      const nmsThresh = parseFloat($('nmsInput').value);

      const boxes = [], scores = [], classIds = [];

      for (let a = 0; a < numAnchors; a++) {
        let bestScore = 0, bestClass = 0;
        for (let c = 0; c < numClasses; c++) {
          const s = raw[(4 + c) * numAnchors + a];
          if (s > bestScore) { bestScore = s; bestClass = c; }
        }
        if (bestScore < confThresh) continue;

        const cx = raw[0 * numAnchors + a];
        const cy = raw[1 * numAnchors + a];
        const w  = raw[2 * numAnchors + a];
        const h  = raw[3 * numAnchors + a];

        const x1 = Math.max(0, Math.min(imgW, (cx - w / 2 - padX) / scale));
        const y1 = Math.max(0, Math.min(imgH, (cy - h / 2 - padY) / scale));
        const x2 = Math.max(0, Math.min(imgW, (cx + w / 2 - padX) / scale));
        const y2 = Math.max(0, Math.min(imgH, (cy + h / 2 - padY) / scale));

        boxes.push([x1, y1, x2, y2]);
        scores.push(bestScore);
        classIds.push(bestClass);
      }

      const keepIdx = nms(boxes, scores, nmsThresh);
      return keepIdx.map((i) => ({
        x1: boxes[i][0], y1: boxes[i][1],
        x2: boxes[i][2], y2: boxes[i][3],
        score: scores[i],
        classId: classIds[i],
        label: CLASSES[classIds[i]] ?? `class${classIds[i]}`,
      }));
    }

    // ── Image helpers ─────────────────────────────────────────────────────────────
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
        img.src = url;
      });
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // ── Rendering ─────────────────────────────────────────────────────────────────
    function drawDetections(img, dets) {
      const maxW = 480;
      const ds = Math.min(1, maxW / img.naturalWidth);
      const w = Math.max(1, Math.round(img.naturalWidth * ds));
      const h = Math.max(1, Math.round(img.naturalHeight * ds));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      ctx.font = '11px ui-monospace, monospace';
      for (const d of dets) {
        const color = CLASS_COLORS[d.classId] ?? '#fff';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        const x = d.x1 * ds, y = d.y1 * ds;
        const bw = (d.x2 - d.x1) * ds, bh = (d.y2 - d.y1) * ds;
        ctx.strokeRect(x, y, bw, bh);

        const label = `${d.label} ${(d.score * 100).toFixed(0)}%`;
        const lw = ctx.measureText(label).width + 8;
        ctx.fillStyle = hexToRgba(color, 0.85);
        ctx.fillRect(x, Math.max(0, y - 14), lw, 14);
        ctx.fillStyle = '#000';
        ctx.fillText(label, x + 4, Math.max(11, y - 3));
      }
      return canvas;
    }

    function cropDetection(img, det, size = 96) {
      const padRatio = 0.15;
      const bw = det.x2 - det.x1, bh = det.y2 - det.y1;
      const px = bw * padRatio, py = bh * padRatio;
      const sx = Math.max(0, det.x1 - px);
      const sy = Math.max(0, det.y1 - py);
      const sw = Math.min(img.naturalWidth - sx, bw + px * 2);
      const sh = Math.min(img.naturalHeight - sy, bh + py * 2);
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, size, size);
      return canvas;
    }

    function renderSidebar() {
      // ── Class breakdown ──
      const stats = new Array(CLASSES.length).fill(0);
      for (const d of allDets) stats[d.classId]++;

      const statsEl = $('classStats');
      statsEl.innerHTML = '';
      CLASSES.forEach((name, i) => {
        const row = document.createElement('div');
        row.className = 'classStat';
        row.innerHTML =
          `<span class="classDot" style="background:${CLASS_COLORS[i]}"></span>` +
          `<span>${name}</span>` +
          `<span class="classCount${stats[i] === 0 ? ' zero' : ''}">${stats[i]}</span>`;
        statsEl.appendChild(row);
      });

      // ── Detection crops ──
      const list = $('detList');
      list.innerHTML = '';
      $('detBadge').textContent = String(allDets.length);

      if (allDets.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Detection crops will appear here.';
        list.appendChild(empty);
        return;
      }

      for (const d of allDets) {
        const item = document.createElement('div');
        item.className = 'detItem';
        item.title = `${d.label} · ${(d.score * 100).toFixed(1)}% · ${d.file}`;

        const bar = document.createElement('div');
        bar.className = 'classBar';
        bar.style.background = CLASS_COLORS[d.classId] ?? '#fff';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.style.color = CLASS_COLORS[d.classId] ?? '#fff';
        meta.textContent = `${(d.score * 100).toFixed(0)}% · ${d.label}`;

        item.appendChild(d.crop);
        item.appendChild(bar);
        item.appendChild(meta);
        list.appendChild(item);
      }
    }

    // ── Load model (shared) ───────────────────────────────────────────────────────
    async function compileModel(buf, label) {
      setStatus(`Compiling model (${(buf.byteLength / 1024 / 1024).toFixed(2)} MB) …`);
      session = await ort.InferenceSession.create(buf, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'all',
      });
      setStatus(
        `${label} ready · inputs: [${session.inputNames.join(', ')}] · ` +
        `outputs: [${session.outputNames.join(', ')}]`
      );
      $('processBtn').disabled = $('folderInput').files.length === 0;
    }

    async function loadModelFromUrl() {
      const url = $('modelUrl').value.trim();
      if (!url) { setStatus('Please enter a model URL.'); return; }
      $('loadBtn').disabled = true;
      setStatus(`Fetching ${url} …`);
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
        await compileModel(await resp.arrayBuffer(), url.split('/').pop() ?? 'model');
      } catch (e) {
        console.error(e);
        setStatus(`Failed to load model: ${e.message}`);
      } finally {
        $('loadBtn').disabled = false;
      }
    }

    async function loadModelFromFile(file) {
      setStatus(`Reading ${file.name} …`);
      try {
        await compileModel(await file.arrayBuffer(), file.name);
        $('modelFilename').textContent = file.name;
      } catch (e) {
        console.error(e);
        setStatus(`Failed to load model: ${e.message}`);
      }
    }

    // ── Process folder ────────────────────────────────────────────────────────────
    async function processFolder() {
      const files = Array.from($('folderInput').files).filter((f) => IMG_RE.test(f.name));
      if (!files.length) { setStatus('No image files found.'); return; }

      $('processBtn').disabled = true;
      $('loadBtn').disabled = true;
      $('imageGrid').innerHTML = '';
      allDets = [];
      renderSidebar();

      let totalDets = 0;
      const t0 = performance.now();

      for (let idx = 0; idx < files.length; idx++) {
        const f = files[idx];
        setStatus(`[${idx + 1}/${files.length}] ${f.webkitRelativePath || f.name} …`);
        try {
          const img = await loadImage(f);
          const { tensor, scale, padX, padY } = preprocessYolo(img);
          const out = await session.run({ [session.inputNames[0]]: tensor });
          const outTensor = out[session.outputNames[0]];
          const dims = outTensor.dims;
          // dims = [1, 4+numClasses, numAnchors]
          const numAnchors = dims[2];
          const numClasses = dims[1] - 4;
          const raw = outTensor.data;
          const dets = decodeYoloOutput(raw, numClasses, numAnchors, scale, padX, padY, img.naturalWidth, img.naturalHeight);

          // Image card
          const card = document.createElement('div');
          card.className = 'imgCard';
          card.appendChild(drawDetections(img, dets));
          const cap = document.createElement('div');
          cap.className = 'caption';
          cap.innerHTML =
            `<span class="name" title="${(f.webkitRelativePath || f.name).replace(/"/g, '&quot;')}">${f.name}</span>` +
            `<span class="count${dets.length > 0 ? ' has' : ' zero'}">${dets.length}</span>`;
          card.appendChild(cap);
          $('imageGrid').appendChild(card);

          // Collect crops for sidebar
          for (const det of dets) {
            allDets.push({
              crop: cropDetection(img, det),
              score: det.score,
              classId: det.classId,
              label: det.label,
              file: f.name,
            });
          }

          totalDets += dets.length;
          $('imgCount').textContent = idx + 1;
          $('totalDets').textContent = totalDets;
        } catch (e) {
          console.error(`Failed on ${f.name}:`, e);
        }
        if (idx % 4 === 0 || idx === files.length - 1) renderSidebar();
        await new Promise((r) => setTimeout(r, 0));
      }

      const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
      $('elapsed').textContent = `${elapsed}s`;
      renderSidebar();
      setStatus(`Done · ${totalDets} detections · ${files.length} images · ${elapsed}s`);
      $('processBtn').disabled = false;
      $('loadBtn').disabled = false;
    }

    function clearAll() {
      $('imageGrid').innerHTML = '<div class="empty" style="grid-column: 1 / -1;">No images yet — pick a folder and click Process.</div>';
      allDets = [];
      renderSidebar();
      $('imgCount').textContent = '0';
      $('totalDets').textContent = '0';
      $('elapsed').textContent = '—';
      setStatus('Cleared.');
    }

    // Wire up
    $('loadBtn').addEventListener('click', loadModelFromUrl);
    $('modelFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadModelFromFile(file);
    });
    $('processBtn').addEventListener('click', processFolder);
    $('clearBtn').addEventListener('click', clearAll);
    $('folderInput').addEventListener('change', () => {
      const n = Array.from($('folderInput').files).filter((f) => IMG_RE.test(f.name)).length;
      setStatus(`${n} image file${n === 1 ? '' : 's'} selected.`);
      if (session) $('processBtn').disabled = n === 0;
    });

    // Render initial class stats (all zeros)
    renderSidebar();

    // Auto-load distraction.onnx from the same folder if present
    (async () => {
      try {
        setStatus('Looking for distraction.onnx …');
        const resp = await fetch('./distraction.onnx');
        if (!resp.ok) { setStatus('Ready. Load a model to begin.'); return; }
        await compileModel(await resp.arrayBuffer(), 'distraction.onnx');
        $('modelFilename').textContent = 'distraction.onnx';
      } catch {
        setStatus('Ready. Load a model to begin.');
      }
    })();
  </script>
</body>

</html>
